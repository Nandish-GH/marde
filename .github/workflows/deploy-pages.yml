name: Deploy MARDE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Agent negotiation tests
        run: npm run test:agent
      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://mardeinc.com
        run: npm run build
      - name: Verify exported public content
        run: |
          npx tsc --noEmit
          npm run verify:export
      - name: Verify Worker bundle
        run: npm run worker:check
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Browser regression checks on the export
        env:
          QA_EXPORT: '1'
        run: npm run test:browser
      - name: Upload matching Worker content
        uses: actions/upload-artifact@v4
        with:
          name: agent-worker-content
          path: worker/generated/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  agent-worker:
    # Opt-in requires the owner to configure proxied DNS, credentials and this variable.
    if: vars.CLOUDFLARE_AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: agent-worker-content
          path: worker/generated/
      - name: Wait for matching GitHub Pages release
        run: node scripts/wait-for-agent-release.mjs
      - name: Activate Worker on the existing origin routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --route 'mardeinc.com/*' --route 'www.mardeinc.com/*'
      - name: Verify production endpoints and machine-readable files
        run: npm run verify:public
